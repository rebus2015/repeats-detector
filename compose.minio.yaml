# Use with compose.yaml; MinIO uses port 9002 so the S3Mock data remains available.
services:
  minio:
    build:
      context: .
      dockerfile: deploy/Minio.Dockerfile
    environment:
      MINIO_ROOT_USER: repeats-local
      MINIO_ROOT_PASSWORD: repeats-local-secret
    ports: ["127.0.0.1:9002:9000", "127.0.0.1:9003:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
  service:
    environment:
      S3_ENDPOINT: http://minio:9000
    depends_on:
      minio: {condition: service_healthy}
volumes:
  minio-data:
