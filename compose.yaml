name: repeats-detector
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repeats
      POSTGRES_PASSWORD: repeats
      POSTGRES_DB: repeats
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repeats -d repeats"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    image: rabbitmq:4-management-alpine
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672", "127.0.0.1:15692:15692"]
    volumes: ["rabbit-data:/var/lib/rabbitmq", "./deploy/rabbitmq-enabled_plugins:/etc/rabbitmq/enabled_plugins:ro", "./deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  s3mock:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: audio
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["127.0.0.1:9000:9090"]
    volumes: ["s3-data:/s3mockroot"]
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317"]
  service:
    build: .
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://repeats:repeats@postgres:5432/repeats?sslmode=disable}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: repeats-local
      AWS_SECRET_ACCESS_KEY: repeats-local-secret
      S3_ENDPOINT: http://s3mock:9090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      INPUT_QUEUE: "${INPUT_QUEUE:-audio.tasks}"
      OUTPUT_QUEUE: "${OUTPUT_QUEUE:-audio.results}"
      DLQ_QUEUE: "${DLQ_QUEUE:-audio.tasks.dead}"
      HTTP_ADDR: "${HTTP_ADDR:-:8080}"
      WORKERS: "${WORKERS:-2}"
      MAX_WAV_BYTES: "${MAX_WAV_BYTES:-128000000}"
      MAX_FINGERPRINTS: "${MAX_FINGERPRINTS:-1000000}"
      MAX_SEARCH_HITS: "${MAX_SEARCH_HITS:-200000}"
      MAX_HASH_POSTINGS: "${MAX_HASH_POSTINGS:-32}"
      TASK_TIMEOUT: "${TASK_TIMEOUT:-2m}"
      PUBLISH_TIMEOUT: "${PUBLISH_TIMEOUT:-10s}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-30s}"
      SEARCH_WINDOW: "${SEARCH_WINDOW:-60m}"
      INDEX_RETENTION: "${INDEX_RETENTION:-90m}"
      TASK_RETENTION: "${TASK_RETENTION:-168h}"
      CLEANUP_INTERVAL: "${CLEANUP_INTERVAL:-5m}"
      MIN_MATCH_SECONDS: "${MIN_MATCH_SECONDS:-2}"
      MIN_MATCH_FRAMES: "${MIN_MATCH_FRAMES:-12}"
      MIN_MATCH_COVERAGE: "${MIN_MATCH_COVERAGE:-0.08}"
      MAX_MATCH_GAP_SECONDS: "${MAX_MATCH_GAP_SECONDS:-0.8}"
      REQUIRE_TLS: "${REQUIRE_TLS:-false}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      RABBITMQ_CONNECT_TIMEOUT: "${RABBITMQ_CONNECT_TIMEOUT:-10s}"
      RABBITMQ_HEARTBEAT: "${RABBITMQ_HEARTBEAT:-10s}"
      RABBITMQ_RECONNECT_DELAY: "${RABBITMQ_RECONNECT_DELAY:-2s}"
      TASK_DELIVERY_LIMIT: "${TASK_DELIVERY_LIMIT:-5}"
      TASK_RETRY_DELAY: "${TASK_RETRY_DELAY:-1s}"
      OUTBOX_POLL_INTERVAL: "${OUTBOX_POLL_INTERVAL:-100ms}"
      OUTBOX_RETRY_DELAY: "${OUTBOX_RETRY_DELAY:-2s}"
      DELIVERY_POLL_INTERVAL: "${DELIVERY_POLL_INTERVAL:-100ms}"
      STARTUP_TIMEOUT: "${STARTUP_TIMEOUT:-30s}"
      CLEANUP_TIMEOUT: "${CLEANUP_TIMEOUT:-30s}"
      CLEANUP_PRINTS_BATCH_SIZE: "${CLEANUP_PRINTS_BATCH_SIZE:-50000}"
      CLEANUP_TASKS_BATCH_SIZE: "${CLEANUP_TASKS_BATCH_SIZE:-1000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-repeats-detector}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-10000}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_always_on}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-}"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      s3mock: {condition: service_started}
      collector: {condition: service_started}
    restart: unless-stopped
volumes:
  postgres-data:
  rabbit-data:
  s3-data:
