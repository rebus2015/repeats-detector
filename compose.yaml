name: repeats-detector
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repeats
      POSTGRES_PASSWORD: repeats
      POSTGRES_DB: repeats
    # Локальная утилита подключается к PostgreSQL через порт 55432 на хосте.
    ports: ["127.0.0.1:55432:5432"]
    # Именованный том хранит результаты и отпечатки между пересозданиями контейнера.
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repeats -d repeats"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
