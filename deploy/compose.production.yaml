# External PostgreSQL/RabbitMQ/MinIO/SigNoz must be provisioned independently.
# REPEATS_IMAGE must name the reviewed immutable service image (prefer @sha256).
services:
  service:
    image: ${REPEATS_IMAGE:?set REPEATS_IMAGE}
    env_file: ./production.env
    environment:
      REQUIRE_TLS: "true"
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
    secrets: [aws_credentials]
    read_only: true
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:8080/readyz]
      interval: 15s
      timeout: 3s
      retries: 3
secrets:
  aws_credentials:
    file: ./aws_credentials
